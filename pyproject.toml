[project]
name = "vsphere-triage"
version = "0.5.0"
description = "Read-only vSphere MCP server that triages stuck, hung and unreachable VMs across a fleet and names the shared cause (optional vROps history)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Heknon" }]
keywords = ["mcp", "vsphere", "vcenter", "esxi", "triage", "diagnostics", "read-only", "pyvmomi", "vrops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "mcp>=2.1,<3",
    "pyvmomi>=8.0.2",
    "httpx>=0.27",
    "pydantic-settings>=2.3,<3",
    "typer>=0.18,<1",
    "pillow>=10",
    "regex>=2024.4.16",
]

[project.optional-dependencies]
# OCR of the console screen. Needs the tesseract binary on PATH as well.
ocr = ["pytesseract>=0.3.10"]

[dependency-groups]
# Dev tooling. A uv dependency-group (installed by default by `uv sync` /
# `uv run`), not a published extra.
dev = ["pytest>=8", "ruff>=0.16.7,<0.17", "ty>=0.0.1a10"]

[project.scripts]
vsphere-triage = "vsphere_triage.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vsphere_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs Docker and the vmware/vcsim image"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # The formatter decides these.
    "COM812",
    "ISC001",
    # Each contradicts a rule kept: D211 and D212 win.
    "D203",
    "D213",
    "CPY001",
    "TRY003",
    "EM101",
    "EM102",
    # pyVmomi objects are untyped; `Any` at that boundary is the truth.
    "ANN401",
    # Docstrings here name what a function returns ("The VMs in a folder"),
    # which reads better for a reader of results than an imperative verb.
    "D401",
]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.isort]
known-first-party = ["vsphere_triage"]
known-third-party = ["mcp"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D100", "D101", "D102", "D103", "D104", "D107", "PLR2004", "SLF001", "INP001", "S105", "S106", "S603", "S607", "S310", "S311", "ARG001", "PLR0913", "FBT001", "FBT003", "C901", "PLR0915"]
# Command-line scripts a person runs by hand: they print, and are not a package.
"evals/**" = ["INP001", "T201", "S310", "PLR2004", "D103"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# mcp's ToolAnnotations fields (readOnlyHint, destructiveHint, ...) are real;
# ty reads its pydantic model as discarding them. A library-model limitation,
# not our code — everything else stays strict, and the package checks clean.
pydantic-discarded-extra-argument = "ignore"
